    StateStore publication in todo_lib/local/store.py currently carry combined snapshot/token/synced_at.
    Synchronizer.refresh_locked and Reporter._prepare publish after _reconcile. workflows.init._observe and
    initialization publication, lifecycle._bounded_discover, moves._publish and Gateway.execute/current
    retrieval also exchange or publish snapshots/tokens. CaptureWorkflow, CommentWorkflow and LifecycleWorkflow
    construct Current from synchronized results. Inspect every retrieve/prepare_candidates/Current caller
    and directly affected fake; preserve proven active provenance with its actual token or explicitly
    invalidate only disposable provenance where it cannot be maintained. Do not relabel combined context
    as fresh. Preserve operation-attributed accepted/rejected/unknown/unattempted proof, both reminder
    types, read-only recovery and all existing callers'' usable signatures/defaults; compatible optional
    representation changes belong in the existing modules/docstrings. Keep one retrieval engine and existing
    JSON publication with one binding timezone authority.


