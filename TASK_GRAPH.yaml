- id: T03
  title: Lossless command grammar and one prompt path
  origin_stage_ref: release-1
  observable_outcome: Canonical commands and aliases produce the same lossless request, and every interactive
    question can share one safe input path.
  dependencies:
  - task_ref: T01
    kind: interface
    interface_ref: managed-model
    reason: Consume completed capabilities managed-model, time-policy and their actual exported APIs.
  goal: 'Implement canonical grammar/alias normalization and the shared prompt/input contract. Read the
    full command-interface and operation synopses: preserve original shell-argument groups through scalar
    extraction, leading scalar noun-action adjacency, fixed-priority arity, repeated independent comment/step
    groups, explicit literal insertions, one-selector shorthand and multi-term marker forms. Preserve
    positional move first source plus joined destination and exactly empty promotion; marker forms retain
    their separate grammar. Enforce duplicate/global conflicts and invalid combinations before config/HTTP.
    Unknown top-level words become full implicit selectors. Supply independent help data/dispatch; T16
    completes discoverable help across all commands. Shared prompts flush before blocking, enforce both
    TTYs, hide token echo and restore on cancel/SIGINT. Runtime workflows in later tasks must use it.'
  failure_domain: Canonical commands and aliases produce the same lossless request, and every interactive
    question can share one safe input path.
  verification_rationale: Table-driven argv-to-request tests provide direct feedback without full CLI
    or HTTP. Compare alias canonical requests with original text/literals retained, including --due=VALUE
    before step operands, multiword scalar, edge-space split trigger, literal option-like title, empty
    versus whitespace promotion and bad combinations with zero side effects. Prompt stream callbacks verify
    flush-before-read, both-TTY refusal, hidden input failure and EOF/cancel; workflow-specific confirmation
    tests remain with their consumers. Run the named focused unittest command while implementing; it is
    a starting point for relevant dependency checks. Required tests must not silently skip. The runner
    owns settled integrated/final broad checks; do not repeatedly run a full suite for each role.
  correction_instructions: null
  requirement_refs:
  - REQ-CLI-031
  - REQ-CLI-012
  - REQ-CLI-033
  constraint_refs:
  - REQ-ARCH-002
  - REQ-CLI-021
  - REQ-CLI-024
  - REQ-CLI-029
  - REQ-CLI-030
  - REQ-CLI-032
  - REQ-CLI-035
  - REQ-COMMENT-008
  - REQ-COMP-005
  - REQ-COMP-008
  - REQ-CREATE-007
