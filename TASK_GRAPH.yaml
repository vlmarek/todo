    optional context/callback arguments are permitted). Seed covered active owners from complete freshly
    merged current Sync notes, including authoritative empty owner sets. An event on a covered active
    owner selects current surviving text from that evidence without an extra REST request, even if its
    posted_at is old or it is blank. Additional unchanged active owners must not add REST comment calls.
    For owners not covered by fresh Sync, exhaust scoped REST comments once and reuse the successful complete
    response, including between reconciliation and report preparation; multipage retrieval still counts
    all actual pages. A filtered unknown-owner lookup must not masquerade as a complete owner response.
    Keep note/owner identities, conflicting duplicates, cyclic/missing ancestors, relevance-first mapping
    and exact continuation errors strict. Never reuse a failed or partial result. A new command must obtain
    its own fresh required evidence; no final comparison Sync or reread for a later concurrent edit.


