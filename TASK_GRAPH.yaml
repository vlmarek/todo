    active Sync and active-only task GET do not establish current archived metadata; ActivityEvents optional
    extras do not guarantee a complete current parent/scope/lifecycle correction; ensure_last_state has
    no implementation. Therefore keep complete category-scoped completed retrieval on every report and
    existing within-command completed/activity reuse. Do not add coverage-based skipping, coverage schema
    or a second archive/invalidation system. Verify that an old retained occurrence/coverage marker cannot
    substitute for fresh archived owner/parent evidence. This fulfills the conditional investigation with
    an explicit limitation, not unconditional completion caching. Preserve preview intervals, gaps, binding
    changes and corrupt protected-state behavior without introducing a new recovery path.


