  goal: Implement capture-scheduling from canonical requests. Validate complete batch and proposed observable
    result, all active sibling sets/tree hiding/capability/depth before first mutation. New tasks P2, steps
    copy synchronized parent effective priority; repeated steps are siblings, inline steps on one parent
    unscheduled, several parents plus inline steps invalid. Parent/inline completion order uses gateway
    ordinary completion semantics; general recursive existing-tree done belongs to T18. Execute one object
    and options before next, stop first failure/unknown with no rollback. Scheduling locally understood
    values preserves recurring due metadata; unknown parser expressions only submit when required comparisons
    are possible. Preserve reminders absent marker, replace/clear explicitly, accept minute-zero only and
    reject duplicate equivalent offsets. hide requires future own attention day, optional reason independent
    label, whole-ancestor/descendant validation and missing label init advice only when adding. unhide preserves
    date/rule/reminders and reports inherited suppression; full clear removes all scheduling/hiding. Reconcile
    actual attention <=2s only under strict day/rule/zone; print actual creation Due and truthful accepted/unknown
    recovery.
  failure_domain: Validated creation and scheduling requests produce actual reconciled task/step state
    with ordered partial outcomes.
  verification_rationale: Workflow tests use real grammar, gateway request assertions and independent
    normalized after-state. Cases include split batch collision before HTTP mutation, step under depth-4
    refusal, effective parent default, late reminder failure preserving accepted creation, 0m preservation/clear/no-op,
    recurrence-preserving date-only/timed/floating/fixed updates, unknown hiding expression diagnostic
    and explicit today rejection. Test +/-2s inclusively versus >2s/day crossing with actual returned
    state, own reasonless policy and category-hidden descendants. Do not duplicate a complete CLI suite;
    T16 supplies public composition. Run the named focused unittest command while implementing; it is
    a starting point for relevant dependency checks. Required tests must not silently skip. The runner
    owns settled integrated/final broad checks; do not repeatedly run a full suite for each role.
  correction_instructions: 'Command-time precision: REQ-TIME-001 and REQ-VERIFY-024 supersede only exact
    subsecond command-time demands in older selected definitions and inherited precise-interface descriptions.
    Ordinary timezone-aware datetime projection is permitted for urgency, countdowns, relative attention
    scheduling and relative report-boundary parsing; preserve one applicable command-time reference, full-second
    distinctions, account timezone/calendar/DST correctness and exact templates. Preserve precise stored
    values, full-instant ordering, explicit absolute inputs and exact no-op semantics, resolved report event
    eligibility and finalization/cleanup. Do not add an exact-clock API repair, forced whole-second normalization
    or storage migration. Use the existing aware-datetime parse_attention API for relative expressions,
    converting the one synchronized command-time value if needed. Its subsecond projection is permitted;
    do not rewrite the shared clock/domain interfaces. Reuse relative scheduling evidence for elapsed minutes/hours
    versus calendar days/weeks/months, DST refusal and aliases. Explicit absolute changes, including small
    requested differences, still use exact no-op comparison and preserve unrelated stored fractions. Preserve
    precise timestamps and nullable creation values in copied/replaced/reconciled model records using T19
    helpers; scalar changes and creation-time completion must not round unrelated fields. Extend an existing
    scheduling/creation after-state fixture with a precise known sibling and a null creation value, verifying
    exact fields through returned/published state. General recursive existing-tree done belongs to T18;
    the original goal reference to T13 is a stale pointer, not lifecycle ownership. Publication boundary:
    docs/design/publication-failure.md supplies the scoped successors to the earlier cache/history/interruption
    promises. Apply REQ-CACHE-009/010, REQ-LOCAL-007 and REQ-CLI-036 to this task; old selected definitions
    remain binding outside that explicit scope. After the first successful destination replacement, later
    failure may leave individually complete mixed files requiring explicit recovery; never promise a usable
    old snapshot or accept a mixed view. Preserve pre-publication files, pending-history content, exact
    timestamps, remote outcome classification and no mutation replay. Creation/scalar/scheduling workflows
    consume synchronized-state failure facts. Preserve accepted/unknown/unattempted remote receipts after
    failed publication and do not replay to repair local state. Adapt existing controlled after-state/failure
    fixtures to the scoped boundary; detailed publisher evidence is supplied by T08 and recurring mutation
    evidence by T18.'
