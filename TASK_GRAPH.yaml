- id: T11
  title: Terminal setup and stable initialization
  origin_stage_ref: release-1
  observable_outcome: A new or populated configuration initializes the chosen managed scope safely; valid-binding
    repeats preserve pending history/cursor, and failed first-init publication has the explicit manual-recovery
    boundary.
  dependencies:
  - task_ref: T19
    kind: interface
    interface_ref: managed-model-precise
    reason: 'Consume the completed shared precision repair: managed-model-precise, state-store-precise,
      history-store-precise.'
