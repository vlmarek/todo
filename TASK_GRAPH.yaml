  goal: Implement initialization capability. With populated config validate all local state before HTTP;
    missing/owned zero-byte config uses terminal-only wizard, explicit limited mode repairs before credentials,
    hidden token or environment (never persist environment token), transient eligible root/category discovery
    and exact fallback suggestions. Confirm full proposed config/structure before protected config save
    and same-invocation continuation; cancellation/failed discovery cannot provision fallbacks. Existing
    binding prohibits account/root switching even with config deleted. Read-only full-plus-delta live-task
    preflight precedes every provision, needs no activity endpoint/history capability and accepts legitimate
    checked false, nullable timestamps, optional descriptions and floating due. Provision only missing
    authorized root/default categories/waiting label, then full-plus-delta validation, staged cache/history/cursor
    and binding-last publication. Repeat init with a valid binding preserves cursor/pending history. Report
    saved configuration separately from init failure and accepted remote creations for explicit remote-provisioning
    reuse. Failed local first-init publication follows REQ-INIT-009; successful rerun recovery of every
    partial local state is not promised.
