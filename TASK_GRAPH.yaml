  goal: 'Implement synchronized-state, connecting adapter current/history evidence to protected storage.
    Preserve known objects/comments/ancestry on externally established completion, reconcile reopen/moves/deletions/scope
    departure and let current truth override observations including known-to-null added_at. Missing active
    identity alone proves nothing: fetch supported lifecycle evidence or fail. Merge pending history independently
    of cache and retain required contents through failed refresh and explicit cache clear, with per-file
    protection on publication, with identity/publication consistency. Newly invalid remote state prevents
    synchronized normal output/mutations but preserves old cache before publication begins; subsequent offline
    reads can use a consistent saved snapshot with age warning (>24 elapsed hours). Clear only after syntax/config/binding/path/lock
    validation, disclose deletion even if rebuild fails. No persisted clean/outdated/blocked mode or automatic
    sync-token classifier. Expose post-accepted-operation reconciliation and errors distinguishing remote
    outcome from local failure, without replay or false external-repair advice.'
  failure_domain: External lifecycle changes survive refresh/restart/cache rebuild until finalized reporting
    releases them.
  verification_rationale: Start by observing open A and nested B with own comment through real adapter mapping,
    then fake a supported external completion while A remains open. Observe retention after refresh, new
    process reload and clear/rebuild; do not seed completed history. Compare old cache/cursor bytes after
    failed delta, invalid remote state or failure before the first successful replacement and verify later
    coherent offline access has zero HTTP; later-file failure follows REQ-VERIFY-023. Confirmed deletion/departure
    removes managed data from both stores; unresolved disappearance fails. Corrupt/missing required history
    survives clear attempt unchanged; no silent reset. Account/timezone/publication mismatch and unrelated-data
    disk/output checks cover inherited constraints. Run the named focused unittest command while implementing;
    it is a starting point for relevant dependency checks. Required tests must not silently skip. The runner
    owns settled integrated/final broad checks; do not repeatedly run a full suite for each role.
  correction_instructions: 'Use T19 precise state/history/model contracts throughout current-truth merge,
    pending observations and publication. Extend the existing observed-open -> supported external completion
    -> refresh/restart -> cache-clear/rebuild slice with a >6-digit creation value and precise comment/completion
    evidence. Read the public store after serialization/reload and assert exact keys/text rather than a
    datetime projection; a later authoritative null must replace an older known creation value in both applicable
    stores. Preserve pending context and old bytes before publication begins; later-file failure follows
    the current per-file boundary. No raw-wire timestamp side channel. Publication boundary: docs/design/publication-failure.md
    supplies the scoped successors to the earlier cache/history/interruption promises. Apply REQ-CACHE-009/010,
    REQ-LOCAL-007 and REQ-CLI-036 to this task; old selected definitions remain binding outside that explicit
    scope. After the first successful destination replacement, later failure may leave individually complete
    mixed files requiring explicit recovery; never promise a usable old snapshot or accept a mixed view.
    Preserve pre-publication files, pending-history content, exact timestamps, remote outcome classification
    and no mutation replay. Use the accepted local StateStore publisher as supplied: its per-file cache/history/(initial
    cursor)/binding sequence and mixed-set refusal are intended, not a storage defect to repair. Start from
    todo_lib/local/store.py StateStore.load_consistent_state/prepare_candidates/publish_snapshot and accepted
    adapter APIs. Classify retrieval, candidate preparation and local publication failures separately. Report
    actual cache clearing and publication uncertainty truthfully, including that a new cache file may already
    have been written; remove any unconditional "no new complete cache published"/"history preserved" claim
    after later-file failure. Existing read-only refresh is advice only where local validation permits it;
    otherwise identify consistent-set restoration or applicable init rerun. Do not bypass required history/binding
    validation. In tests/workflows/sync, retain failed-retrieval/first-replacement byte preservation, and
    add a controlled later-history or binding replacement failure through the actual store. Observe complete
    destination bytes and needed pending-history content, then perform a new-process offline read with zero
    HTTP and require mixed-set refusal or coherent saved-state loading. This verifies the current publisher;
    no rollback, journal, extra storage task or local source edit is requested. Retained incident evidence
    is historical; abandoned candidate edits are not a new task input.'
