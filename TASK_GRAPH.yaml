- id: T02
  title: Protected configuration and persistent local state
  origin_stage_ref: release-1
  observable_outcome: Consistent protected local state survives ordinary failed writes, restart and explicit
    current-cache deletion.
  dependencies:
  - task_ref: T01
    kind: interface
    interface_ref: managed-model
    reason: Consume completed capabilities managed-model and their actual exported APIs.
  goal: Implement configuration, state-store, history-store and exclusive-lock contracts with history.json
    as the separate pending-history file. Keep timezone solely authoritative in binding; choose a minimal
    publication association and reject mixed sets without a journal/rollback. Expose candidate validation
    and binding-last publication to init/sync; individual writes remain atomic, not a transaction. Preserve
    missing versus empty/populated config, corrupt readable cursor versus unsafe file, explicit empty
    hidden list and credential precedence. Validate sensitive directory/file modes and symlinks before
    credential reads; expose only the wizard-specific owned real empty-config/directory mode-repair operation
    for T11 to confirm. Provide history merge/prune primitives retaining newer shared context; only T15
    may authorize report cleanup after finalized output/cursor. Do not perform network calls or prune
    on cache clear/cursor set.
  failure_domain: Consistent protected local state survives ordinary failed writes, restart and explicit
    current-cache deletion.
  verification_rationale: Use temporary homes and injected replace/write failure to compare old bytes,
    check 0700/0600 and symlink/permissive-mode refusal before secret access, config negatives/unknown
    keys and redaction. Separate processes demonstrate fail-fast lock and release plus consistent lock-free
    reads. Reload nullable timestamps, foreign identity/publication mismatch, missing/corrupt required
    history; clearing cache leaves history and cursor byte-identical. Post-finalization cleanup eligibility
    is tested as a primitive; workflow ordering belongs to T15. Run the named focused unittest command
    while implementing; it is a starting point for relevant dependency checks. Required tests must not
    silently skip. The runner owns settled integrated/final broad checks; do not repeatedly run a full
    suite for each role.
