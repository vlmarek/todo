    while run still labels the phase terminal setup. Place the discovery/mapping work under an accurate
    remote-discovery phase while keeping actual TTY/hidden-input failures distinct and preserving configuration
    publication, cancellation, saved-config, preflight, provisioning and post-provision diagnostics. Keep
    discovery failure nonzero, with no empty-account fallback or provisioning. Avoid a general phase/recovery
    architecture.

