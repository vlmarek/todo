- id: T31
  title: Use cached selection and preflight across task and step workflows
  origin_stage_ref: cached-selection
  observable_outcome: Every task/step operand and preflight uses valid saved context; direct
    operations target cached IDs before any freshness read, while post-operation and report
    truth remain enforced.
  dependencies:
  - task_ref: T08
    kind: interface
    interface_ref: synchronized-state
    reason: Extend read_local and publication while preserving explicit refresh and accepted-operation
      reconciliation.
  - task_ref: T10
    kind: interface
    interface_ref: read-commands
    reason: Reuse concrete title/child/recent/mixed-destination candidate and chooser behavior.
  - task_ref: T12
