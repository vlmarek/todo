- id: T04
  title: Controlled API-v1 HTTP transport
  origin_stage_ref: release-1
  observable_outcome: Actual outgoing requests obey API-v1 authentication, encoding, timeout and safe
    retry rules.
  dependencies:
  - task_ref: T01
    kind: interface
    interface_ref: managed-model
    reason: Consume completed capabilities managed-model and their actual exported APIs.
  goal: Implement http-transport and small reusable controlled HTTP helpers for actual adapter request
    assertions. Resolve credentials upstream once; transport receives the resolved secret and redacts
    every display/error/traceback path. Use stdlib urllib and explicit form/query/JSON encodings; no SDK
    or production endpoint override. Honor 30s and four total attempts, status whitelist, 1/2/4 fallback
    delays and usable Retry-After <=60s. Ambiguous mutation requests return for reconciliation before
    replay; never classify transport loss as rejection or repeat an unsafe call. Distinguish exhausted
    reads, structured rejection and protocol failure. Test helpers must reject representative wrong method/path/form/UUID
    arguments and cite pinned sources; do not generate fixtures from application serialization. Hooks
    are normal constructor/function dependencies, not public test configuration.
  failure_domain: Actual outgoing requests obey API-v1 authentication, encoding, timeout and safe retry
    rules.
  verification_rationale: Controlled opener/clock/sleep tests inspect actual requests and count attempts/delays
    with no real sleep/network. Cover nonretry status, each policy category, Retry-After above cap, malformed
    response, ambiguous mutation no blind replay and token/Authorization redaction. Use synthetic tokens
    only, including captured exception paths; tests never read real HOME or environment secrets. Run the
    named focused unittest command while implementing; it is a starting point for relevant dependency
    checks. Required tests must not silently skip. The runner owns settled integrated/final broad checks;
    do not repeatedly run a full suite for each role.
