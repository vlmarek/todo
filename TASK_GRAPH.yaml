    reconstruction during operation attribution and reconciliation. Preserve exact timestamps and authoritative
    null in accepted/rejected/unknown after-state results; occurrence proof must distinguish events that
    differ below a microsecond. Keep command UUID/temp-ID proof and attention reconciliation tolerance unchanged.
    Adapt tests/adapter/commands fakes to the actual dependency types and include precise after-state preservation
    in an existing reconciliation case.
