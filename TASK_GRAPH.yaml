    callers and scope assertions, and the independent literal fixture in tests/delivery/final/copy_probe.py.
    The existing test_documented_project_scope_fields_are_authority currently treats is_shared as ignored;
    replace only that superseded expectation with the approved contract. Keep internal domain/shared assertions
    unchanged. Repair affected test consumers across adapter/workflow/CLI/delivery paths as necessary
