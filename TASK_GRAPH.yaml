    retaining the New York recurring rule/zone; and exact equivalence versus same-first-instant differing
    semantics. Use representative cases and adequate existing tests rather than a cross-product. Existing
    elapsed/calendar/month, precision, keep/consent, date-only partial failure, UUID/unknown, account-zone-change
    and publication tests remain applicable; adapt assertions only where the successor changes them.


