  verification_rationale: Removing preflight crosses shared state, direct commands, lifecycle
    history and editor/caller paths. One usable coupled implementation avoids interim fake freshness
    contracts. The new focused composed suite distinguishes network ordering and cached identity;
    existing local/current/sync suites verify compatible persistence and fresh consumers. Full
    product regressions run through the existing settled-subject final-delivery gate.
  correction_instructions: Apply only Design revision 13 freshness precedence. Preserve all
    30 accepted effective assignments, retained provider bytes and earlier evidence. Repair
    all directly affected callers/fakes, including prerequisite copied-runtime fixtures, in scope;
    no fresh preflight hidden behind a helper,
    no stale-report mode, no relaxation of actual post-operation validation or protected-history
    failure. Missing legacy cache facts require explicit refresh when needed; never reset protected
    state.
