- id: T36
  title: Reuse mutation evidence and scope ordinary-write historical reconciliation
  origin_stage_ref: mutation-retrieval-reuse
  observable_outcome: Ordinary task/step writes reuse complete authoritative evidence and incremental
    current state, retrieve only necessary affected history, and publish each accepted operation before
    the next; later explicit refresh/report retrieves deferred history without loss.
  dependencies:
  - task_ref: T34
    kind: interface
    interface_ref: named-zone-gateway
    reason: Extend the accepted Gateway/current scheduling and reminder reconciliation path compatibly.
  - task_ref: T31
    kind: interface
    interface_ref: cached-task-step-workflows
    reason: Retain saved stable-ID preflight and migrate ordinary workflow reconciliation consumers.
  - task_ref: T29
    kind: interface
    interface_ref: reconciled-completion-reports
    reason: Preserve occurrence reconciliation and report retrieval/finalization while history is deferred.
  - task_ref: T02
    kind: interface
    interface_ref: state-store
    reason: Preserve token/current-resource pairing and compatible protected state publication.
  - task_ref: T17
    kind: repository_state
    interface_ref: null
    reason: Reuse the copied-entry-point harness and append truthful observed acceptance evidence.
  goal: 'Implement REQ-SYNC-036/037 and REQ-VERIFY-035 on the accepted application at 5b99bbbccc2f317036faab2ca924ef88b2fb5684.
    Read docs/design/mutation-retrieval-reuse.md and its narrow precedence first. Preserve accepted assignments
    and original evidence. This task owns the complete evidence producer/consumer adaptation, necessary
    current-versus-history provenance and focused/composed/copied verification; no speculative caching
    service or performance target.


    Start at adapter/commands.py Operation, Result and Gateway.execute. Result currently contains outcome,
    operation, target_id, after: Current|None, actual, evidence, issues, restored_ancestors and occurrences.
    Gateway already retrieves current state after submission and retains complete HistoryAdapter Retrieval
    values for completion/activity/comment reads. adapter/current.py Current retains snapshot/token, missing/deleted/departed
    IDs, unresolved reminder evidence, proven current_snapshot, reminder membership and waiting-label
    IDs. HistoryAdapter Retrieval(records,pages,start,end) denotes complete exhausted retrieval; preserve
    request scope/owner and coverage explicitly when sharing it. These are observed baseline APIs, not
    an invented future constructor. Extend them minimally and compatibly, documenting concrete symbols
    in existing API.md. Evidence is operation-local and attributable to this exact UUID/temp-ID, not proof
    based on valid state, matching title or an earlier operation.


    Trace workflows/capture.py CaptureWorkflow._run, lifecycle.py LifecycleWorkflow._run and comments.py
    CommentWorkflow._apply/_execute_operation. They call reconcile_accepted_locked() without the available
    Result, causing another current retrieval and broad historical work. Synchronizer.reconcile_accepted_locked
    currently delegates to refresh_locked; _reconcile scans each category for missing/recurring owners,
    all archived-owner comments and every recurring owner''s activity. Separate ordinary-write affected
    reconciliation from full explicit refresh/report policy in this existing path. Reuse complete matching
    Current and required scoped Retrieval evidence; fetch only uncovered required owner/ancestor/subtree/reminder/occurrence
    state. Do not repeat equivalent evidence reads solely at a layer boundary. Complete active Sync merging
    still includes and validates unrelated active changes; a missing/invalid required transition cannot
    be silently carried as verified success. Keep raw delta versus proven current baseline distinction,
    tombstones, scope/privacy and contradictory-state validation.


    Moves has a distinct publication path: workflows/moves.py MoveWorkflow._publish already uses operation.after,
    but calls shared _reconcile and supplies inherited completed-descendant context. Migrate it too, preserving
    category-change hydration, actual returned source/destination checks, complete known subtree identities/ancestry
    and inherited category updates without mutating the remote tree to repair state. Do not treat cached
    archived fields as fresh proof. Comment operations on completed owners must share complete owner-comment
    evidence without losing unaffected pending owner context; optional Done comments remain after verified/published
    completion. Preserve stable IDs and ordered stopping for scalar/scheduling/reminder replacement, hierarchy,
    completion/reopen/deletion and editor operations. Inspect rejected/unknown and interruption paths
    explicitly: required outcome reconciliation remains, and a local failure cannot erase acceptance or
    permit replay.


    In adapter/current.py retrieve, expanded currently becomes true for every ID absent from prior.items.
    Remove the unconditional new-item-to-full rule when a new managed task has sufficient complete incremental
    evidence and a valid saved current resource baseline/token. Preserve necessary hydration for scope
    expansion or missing compatible provenance/resources, validation before hydration, preserved tombstone/departure
    evidence, and exactly the existing freshness delta after full candidates. Distinguish entrants carrying
    unchanged comments/reminders from newly created objects whose resources are established; do not guess
    completeness from identity novelty alone or fall back on generic token errors.


    Inspect local/store.py LocalState, _cache and prepare_candidates plus local/history.py and workflows/sync.py
    _known/_reconcile. synced_at and the current token cannot certify historical intervals deferred by
    ordinary writes. Choose the smallest representation/derivation that keeps history coverage independent;
    an existing cursor-bound retrieval may suffice if demonstrated, so do not add a field by default.
    Retain pending observations, comments and required context at their last established state without
    stamping unrelated history freshly observed, advancing the report cursor or pruning it. Preserve newly
    established affected observations and explicit current deletion/departure/privacy evidence. Legacy
    saved states remain readable or take existing explicit disposable-cache recovery without resetting
    protected history. Adapt all actual representation producers/consumers, including init, moves, report
    publication and test fakes. Reporter._prepare currently uses min(start,cursor,synced_at) for historical
    lower bounds and shares _reconcile with an _Evidence facade. Explicit refresh and reports must still
    obtain their full existing required current/historical evidence and complete comments, including information
    deferred across several writes; preserve cross-endpoint occurrence reconciliation and output/flush
    -> cursor -> cleanup.


    Implement a small distinguishing offline composed creation/completion using real Gateway, Synchronizer,
    StateStore and controlled HTTP boundaries. With a valid baseline and sufficient new-item incremental
    resources, create then save/reload its actual identity before completion is submitted. Reuse its current
    result, obtain authoritative affected completion proof once for the needed scope, save completed state,
    and leave unrelated recurring activities/archived comments unread. Assert unrelated returned active
    updates are incorporated and invalid active state fails. Starting from an unrelated pending archived
    owner and a recurring owner, defer their historical changes across intervening writes, then explicit
    refresh or report must retrieve those changes and preserve/report eligible work. Assert cursor/pending
    bytes remain protected on required-read or final-output/cursor failure. Use a case with deferred changes
    predating the last write''s synced_at so an incorrect lower-bound shortcut fails visibly. Reuse existing
    adequate boundary cases rather than repeating every command at every layer.


    Use existing tests/adapter/current/test_current.py entrant/hydration/freshness/tombstone tests; tests/adapter/commands
    for UUID/temp-ID/unknown and lifecycle/comments evidence; tests/workflows/test_cached_selection.py
    for command-first saved IDs, composed reminder ordering and legacy hydration; tests/workflows/{capture,moves,lifecycle,comments,sync,report}
    for consumers and failures. Preserve test_sync.py unresolved absence, invalid actual state, required
    comments, publication-before/after replacement and SIGINT tests; report/test_report.py deferred-window/current-owner,
    activity-only recurrence/undo and finalization tests. Migrate strict source-cited endpoint fakes and
    tests/delivery/final/copy_probe.py before automatic integration gates: fixtures expecting duplicate
    reads or all-history reads after each write must express the new evidence semantics without relaxing
    operation ordering, required scope/coverage or failure assertions. No xfail/expected-failure marker
    may hide a newly required behavior.


    Extend the existing copied-runtime probe with one representative affected write/reload observation,
    retaining its actual copied launcher/modules, strict offline opener and existing clock hooks; no production
    test switch or new framework. Preserve public receipt/stream/date/timezone behavior, cached selection,
    normal refresh/report and installation isolation. Revision-16 notice removal is separately pending
    direct delivery; do not implement, revert or claim that scope in this task. If that delivery is installed
    before this task starts, retain its output behavior and adapt only genuinely affected fixtures.


    Run t36-focused while implementing the coherent Gateway -> accepted publication -> later report slice,
    then relevant affected workflow/local/adapter regressions. Workers may expand focused feedback for
    concrete gaps. The runner''s unchanged final-delivery gate performs one complete offline suite and
    distinct unchanged-copy/PATH/real-less probes on the settled integrated subject; no duplicate worker
    full-suite run is mandated. This task also owns integrated acceptance and appending observed subject/commands/outcomes/reused
    evidence/limitations to docs/implementation/acceptance-evidence.md, preserving earlier bytes. Do not
    edit contract-map or frozen inputs. Synthetic request traces establish algorithm/conformance, not
    measured production latency or live provider guarantees.'
  failure_domain: Authoritative per-operation evidence reuse, historical scope and preservation through
    later synchronization/reporting.
  verification_rationale: One coupled outcome spans Gateway/current retrieval, accepted-operation publication
    and its ordinary consumers. Splitting introduces a temporary evidence contract and tests against an
    incomplete producer/consumer state. The focused command exercises the real current/gateway/saved-state/report
    slice and relevant cached selection; affected existing workflow cases and strict copied fixtures are
    migrated in the same task before shared gates. New traces distinguish reuse, sufficient incremental
    creation, necessary hydration, intermediate publication and deferred changes older than the last write.
    Existing failure/recurrence/tree tests supply unchanged coverage. Final-delivery remains the one complete-suite
    plus distinct copied acceptance gate; no separate audit task is needed.
  correction_instructions: Preserve all newly retrieved active-resource validation, exact operation proof,
    necessary affected history and verification/publication between writes. Do not restore unrelated ordinary-write
    history scans to make old fixtures pass, promote saved history to fresh truth, batch writes, or infer
    completion/deletion from active absence. Missing required evidence is a classified nonzero failure
    with existing recovery. Surface a provider-contract contradiction rather than silently weakening Design.
    Preserve unrelated revision-16 edits.
