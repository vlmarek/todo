  goal: 'Apply only Design revision 6''s provider is_shared correction and wizard discovery failure labeling
    to the completed application. Reuse the actual current.retrieve(transport, binding, prior=None, sync_token=None,
    replace=False) -> Current(snapshot, sync_token, disappeared/deleted/departed IDs), Initializer.run()/initialize()
    -> InitResult or InitError(phase/status/config_saved/provisions), Synchronizer refresh and cli.main(argv)
    APIs. In todo_lib/adapter/current.py coordinate _FIELDS[''projects''], _project, _seed and consumed-value
    duplicate signatures: require provider JSON boolean is_shared, map it to internal Project.shared,
    and reconstruct is_shared from the existing internal property for omitted-project incremental seeds.
    shared is an ignored unknown provider field, never alternate/fallback/reconciliation authority. Reject
    missing, explicit null and wrong types (including numeric 0/1) with field/expected-boolean facts that
    distinguish those conditions; never infer privacy. Preserve deletion tombstone exemption, optional
    Inbox/workspace handling, unrelated-data discard, hierarchy, identity, full-plus-one-delta freshness
    and all other mappings. No internal Project.shared rename, local saved-format migration or compatibility
    branch.

