  goal: Implement mutation-gateway for provision root/category/label, task/step/comment/reminder create/update/delete,
    scalar due/priority/text updates, move and lifecycle calls. Use unique UUID plus temp ID for creates;
    exact UUID sync_status and temp mapping establish result attribution. Ambiguous transport/missing/malformed
    status triggers read-only current/history reconciliation; matching pre-existing title, unchanged recurrence
    or mere valid state cannot prove attempted operation. Return unknown when proof is unavailable, stop
    replay. Use item_move id plus exactly parent_id or project_id, including promotion; item_uncomplete
    with plain ok, recurring item_update_date_complete is_forward=1/0 and reset_subtasks=0. Support completion
    archive disappearance and own comments on supported known archived owners. Write relative reminder
    type/item_id/minute_offset including literal 0, English due lang and recurrence-preserving raw metadata.
    Reconcile exact attention with <=2s absolute slack and strict day/rule/timezone, returning actual
    state. T08 and operation workflows own whole-tree validation and local publication, using these results
    without weakening any clause.
  failure_domain: Direct commands return proven accepted, rejected or unknown outcomes without duplicate
    or compensating mutations.
  verification_rationale: 'Request-rejecting fakes inspect each distinct command family with independent
    after-states, no full Todoist emulator. Cases: lost response with attributable proof versus missing
    status; accepted create but absent temp mapping versus matching existing text; unchanged recurring
    item with no occurrence proof; accepted archived completion and post-completion note_add; ordinary
    reopen plain ok with restored ancestors; one-destination move; zero reminder request and later rejection.
    Source reset_subtasks=0 establishes no reset. Fakes prove application handling, not actual provider
    subtree propagation; contradictory real evidence must stop affected work. Run the named focused unittest
    command while implementing; it is a starting point for relevant dependency checks. Required tests
    must not silently skip. The runner owns settled integrated/final broad checks; do not repeatedly run
    a full suite for each role.'
