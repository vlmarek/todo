    the token in existing cache storage, so only an actual current baseline seeds current._seed. Keep
    all known archived identities/context separately available for disappearance, tombstone, scope departure,
    recurring/reminder and ancestor reconciliation. Never infer active membership from completed flags,
    delta omission, history observations or saved sync time. Existing schema-1 caches lacking provenance
    remain readable offline and may receive one necessary full-plus-freshness hydration online; protected
    history, binding and cursor must not reset. Invalid disposable provenance may rebuild under existing
    cache rules; corrupt required history must still refuse. An ordinary subsequent report with a valid
    new baseline must use the saved token, preserve unchanged resources, merge meaningful changes/deletions
    and retain necessary bounded hydration on genuine scope expansion or server full replacement. Generic
    errors do not authorize token-reset/full fallback.


