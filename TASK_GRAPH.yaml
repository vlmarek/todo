    compatibly, exposing concrete symbols in domain/API.md. A final slash-containing location-zone token
    or UTC is extracted and validated locally; unknown location names fail before writes. Short codes
    such as CET/CEST/CST/EST remain in the full delegated expression even if ZoneInfo accepts them. Preserve
    original input for unresolved previews while sending only the remaining wording and explicit named
    zone to Todoist; do not translate recurrence text or fabricate offset mappings.


