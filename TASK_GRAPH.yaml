- id: T19
  title: Repair shared exact timestamps and persistent round trips
  origin_stage_ref: release-1
  observable_outcome: Full supplied timestamp precision and authoritative null survive shared-model validation,
    exact ordering, cache/history/cursor serialization and reload before adapters and presentation consume
    the repaired contract.
  dependencies:
  - task_ref: T01
    kind: interface
    interface_ref: managed-model
    reason: Repair accepted domain implementation through new successor work while preserving original
      assignment and still-required model/time behavior.
  - task_ref: T02
    kind: interface
    interface_ref: state-store
    reason: Repair accepted codec/history/store implementation in the same coherent task; preserve configuration,
      locking, file safety and publication semantics.
  goal: Implement managed-model-precise, time-policy-precise, state-store-precise and history-store-precise
    as successors to the accepted T01/T02 implementation, without editing their frozen assignments. Start
    from todo_lib/domain/model.py Item/Comment/Occurrence/LifecycleCandidate, _sibling_key and recent
    lifecycle helpers; domain/time.py parse_boundary; local/codec.py instant/parse_instant/snapshot_data/snapshot_from;
    local/history.py History/Coverage/validate_history/merge_history/prune_history; and local/store.py
    StateStore/LocalState/prepare_candidates. Introduce one minimal shared exact-instant value and the
    four public helper exports defined by managed-model-precise; document concrete types, allowed inputs
    and errors in domain/API.md and affected module docstrings. Preserve existing model positional construction
    and aware datetime inputs, exact equality for equivalent offsets, arbitrary supplied fraction digits
    without float/context rounding, null only on nullable fields, exact sibling/lifecycle ordering and
    report-boundary parsing. Keep display/calendar datetime conversion explicitly separate from exact
    comparison/serialization; no adapter-only side channel or implicit projection authority. Adapt persistence
    and pruning together so an integrated repaired model remains serializable, including asdict handling
    of any new value. Keep existing valid schema-1 UTC timestamp strings readable; do not add a migration/reset,
    new file or second timezone. Preserve all account/root/publication checks, binding-last fresh association,
    safe atomic replacement, explicit cleanup authorization and current-truth merge, including known-to-null.
    Existing due/Attention behavior, configuration, credential policy and lock APIs remain required; avoid
    unrelated refactoring.
  failure_domain: Shared timestamp representation, exact semantic comparison and lossless protected persistence
    must agree in one usable prerequisite.
  verification_rationale: 'Reuse t01-focused and t02-focused on the changed subject: they run the domain
    and local packages separately before any adapter/workflow is required. Extend tests/domain/test_model.py,
    tests/domain/test_time.py and tests/local/test_local.py rather than create a new harness. First establish
    a coherent parser -> Item -> cache/history publish/reload -> ordered_siblings slice; then cover affected
    lifecycle, comment/occurrence and pruning consumers in the same suites. Distinguishing data: .123456001Z
    and .123456999Z with IDs opposing time order, .123456789Z round trips, offset-equivalent instants
    and a long supplied fraction that cannot silently round through Decimal default context. Check null-last
    siblings, known-to-null merge and malformed/naive/ wrong-type required timestamps. Compare exact keys/text
    after public StateStore save/reload for cache and separate pending history; round-trip an exact report
    cursor. At a finalized cursor inside one microsecond, retain later observations and their ancestor/comment
    context; cleanup still requires completed output and saved cursor. Preserve existing safety/failure/identity,
    DST-fold interval, hierarchy, recurrence and unknown-time tests; update fixtures only for the documented
    successor type without weakening expectations. Future T05 owns actual HTTP/unchanged-delta evidence,
    T09 human rendering, and T15 report orchestration; this task does not require those unavailable modules.
    Run the two named focused commands; the runner owns whole-product gates.'
  correction_instructions: The observed baseline truncates .123456789Z to .123456+00:00 and orders two
    submicrosecond siblings by ID. INC-55fc7ee8a23146a3 and diagnosis DIAG-9f6ae98a53774e97 identify this
    prerequisite gap. These are evidence, not permission to weaken precision. This task may modify accepted
