    reason: Use known subtree and direct stable source/destination IDs.
  - task_ref: T18
    kind: interface
    interface_ref: lifecycle-transitions
    reason: Replace remote recent discovery with compatible local occurrences while preserving
      post-operation evidence.
  - task_ref: T14
    kind: interface
    interface_ref: comment-editing
    reason: Start editor from saved comments and remove pre-write owner refresh.
  - task_ref: T24
    kind: interface
    interface_ref: complete-reminder-scheduling
    reason: Preserve reminder consent, actual results and caller compatibility.
  - task_ref: T23
    kind: interface
    interface_ref: reminder-gateway
    reason: Reuse direct commands and current/reminder mapping with saved preflight facts.
  - task_ref: T19
    kind: interface
    interface_ref: state-store-precise
    reason: Extend compatible protected JSON context without losing precision or pending history.
  - task_ref: T22
    kind: interface
    interface_ref: tolerant-current
    reason: Carry minimal proven label context from legitimate full/delta resources and preserve
      relevance validation.
  - task_ref: T29
    kind: interface
    interface_ref: reconciled-completion-reports
    reason: Retain current completion evidence and recurring undo semantics in shared history
      and fresh reports.
  - task_ref: T16
    kind: interface
    interface_ref: public-cli
    reason: Preserve public composition, credential source, statuses and receipt formats.
  - task_ref: T30
    kind: repository_state
    interface_ref: null
    reason: Start from the completed revision-12 implementation and subject-bound evidence,
      retaining all accepted code.
  goal: 'Implement the four revision-13 workflow requirements together on the accepted application.
    Read docs/design/cached-selection.md first: its explicit freshness precedence governs this
    task, and all other earlier duties survive. Use the concrete APIs and retained provider
    source navigation in docs/design/external/todoist/cached-selection-notes.md. Preserve public
    CommandRequest, workflow result and classified error shapes; extend internals only as necessary.
    Do not rebuild accepted code.


    Every task/step selector, including reads/implicit lookup, mutation targets, parent/step
    operands, creation parents, lifecycle candidates and mixed item/category move destinations,
    resolves from validated saved state and compatible retained history. Match all operands
    before the first mutation and hold their stable IDs. Keep title/phrase/term matching, scope/eligibility,
    order/context, ambiguity and cancellation unchanged. Retained completed candidates obey
    cursor/now and recurring latest-occurrence rules; remove lifecycle._recent_snapshot preflight
    remote discovery from these paths without deleting the history utilities needed by reports/reconciliation.
    No-match names the full searched selector, says saved data was searched and suggests todo
    --refresh now then retry; required local-state errors propagate as such. Keep supported
    explicit read refresh first, ordinary offline reads zero HTTP, existing flag applicability
    and credential/configuration requirements.


    CaptureWorkflow, MoveWorkflow, LifecycleWorkflow and CommentWorkflow must load the shared
    saved context under their existing lock instead of refreshing before selection/action. Remove
    the editor''s second pre-write refresh and the task/step hiding label-read preflight. Known
    comments seed the editor and stable comment IDs; unchanged valid buffer is a zero-write
    success, all-shown deletion retains its confirmation and foreign/invalid blocks reject before
    writes. Use saved account, bound project/category scope, capabilities and the single binding
    timezone plus one current command time. Existing snapshots carry most facts; extend protected
    JSON/Current/SyncResult plumbing only for missing proven context (notably waiting-label
    availability) and all affected init/sync/report/move/lifecycle publishers, using compatible
    optional metadata as specified in the technical notes. Missing required saved facts fail
    locally with existing explicit-refresh/protected-state recovery; never silently hydrate
    or guess. Keep category creation and initialization on their existing fresh paths: the cache
    policy covers ordinary task/step workflows, including task creation, rather than unrelated
    category mutations.


    Retain syntax, complete-batch/no-op, source-state, scheduling/reminder consent, cached waiting-label
    prerequisite, sibling collision and full known subtree/depth/cycle/hiding checks before
    mutation. Use saved known completed descendants as appropriate. Recursive done keeps known-recurring-descendant
    refusal, preview confirmation and deterministic child-first ordering; move retains source
    and destination identity with the complete known subtree. Deletion shows only saved open/eligible
    completed descendants, including with --yes, with existing older-completed warning, indentation
    and confirmation; do not fetch additional preview descendants. Trust cached stable IDs even
    if remote names/context changed. No remote reselection, substitution, fresh eligibility
    check, stale comparison/conflict prompt or fallback refresh before submission. Earlier ''preserve''
    checks must not fabricate a stale-preflight conflict merely because an untouched field changed
    remotely; actual valid returned context controls receipts, while requested-field/normalization
    and actual invariant checks remain.


    Keep Gateway direct POST /sync commands, UUID/temp-ID/status proof and transport replay
    policy. The first operation-bearing request is the first task/step network action; gateway
    read reconciliation after that request is retained. Build before=Current from saved facts;
    compatible legacy current-resource provenance may trigger required hydration only after
    submission. After each accepted operation retain existing authoritative retrieval, validation
    and publication before the next ordered operation, with selected IDs/order fixed. Preserve
    rejection, unknown outcome, accepted partial failure and unattempted work without unsafe
    replay/rollback. Newly retrieved invalid state still stops the sequence. Required archived-owner
    comments, recurring activity/completion proof and post-mutation account/scope/capability/timezone
    validation remain. No receipt before acceptance; previous values are saved values, help
    explains that basis without changing exact receipt templates or adding progress/warning
    prompts.


    Add the focused tests/workflows/test_cached_selection.py using existing controlled transport
    helpers through real composition, and adapt directly affected existing workflow/caller/request
    fixtures instead of leaving old preflight expectations. Trace first network action and cached
    ID through a meaningful parent/subtree command (not only a leaf rename), plus representative
    creation parent, mixed move destination and editor paths. Cover local ambiguity/no-match/cancellation
    and missing versus invalid local context with zero requests; eligible retained completed
    evidence with excluded cursor boundary and latest recurring undo; a locally invalid proposal
    with no writes; stale-ID rejection without substitution; remote acceptance after changed
    title/context; cached deletion with an unseen remotely cascaded descendant and no preflight
    read; and accepted mutation followed by reconciliation failure. Distinguish mutation POST
    from later read POST /sync and do not preseed the very metadata discovery being tested.
    Reuse adequate negatives for unknown/SIGINT/ordered partial operations, pending history
    and report finalization; add a specific case only where changed control flow exposes an
    uncovered risk.


    Migrate the existing task/step request fixtures in tests/delivery/final/copy_probe.py
    as part of this implementation, before T31 can reach its required final-delivery gate.
    INC-b0a2df933ac4482d exposed mutation phase expecting a read Sync before item_update;
    assess every existing task/step editor/reminder/mutation phase, including tolerance and
    tolerance-read, rather than deleting only that first observed read. Seed valid saved
    context through the existing legitimate init/explicit-refresh phases. Require the cached-ID
    operation-bearing request first, zero requests for unchanged editor/local refusal, and
    exact authoritative post-operation reads/publication. Keep Boundary strict: no optional
    reads, request skipping, accepting both freshness policies or source-runtime imports.
    Preserve initialization, explicit refresh, category-only and revision-12 fresh-report
    request/evidence behavior, output/status assertions and copied-runtime isolation. T32
    retains the distinguishing new copied scenario and acceptance audit; it cannot own
    prerequisite fixture migration needed for T31 acceptance.


    For directed fixture feedback, copy unchanged todo and todo_lib to a disposable installation,
    use a temporary home and the existing scripts/verify_clean.py environment allowlist,
    put that installation first on PATH and invoke python3.11 -I -B COPY_PROBE INSTALL for
    all existing copy_probe phases. This runs copied probes without scripts/check or another
    complete suite; retain its command and result. The runner still runs the complete
    unchanged final-delivery gate on the integrated subject.


    Use t31-focused for early directed feedback, t02-focused/t05-focused/t08-focused for compatible
    metadata/store/current/refresh regression, and affected existing focused test cases for
    actual caller repairs. Tests/workflows/capture, moves, lifecycle, comments and tests/cli
    contain existing refreshed doubles/request expectations that must migrate to saved-state
    setup; expand directed checks for concrete changed callers. The runner retains final-delivery
    as its full offline/copy gate. Do not add another complete suite, live network, latency
    benchmark, framework, database, identity ledger or background worker. Report a real provider
    contradiction or needed product choice instead of silently weakening these obligations.'
  failure_domain: Coupled saved-context representation, task/step selector and pre-mutation
