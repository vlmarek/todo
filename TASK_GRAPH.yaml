    due_arguments, Operation, Gateway.create_task/update_task/create_reminder/update_reminder and execute
    reconciliation. Each absolute reminder independently chooses its supplied zone or the binding default,
    never another scalar''s zone. Locally exact requests send documented UTC due.date plus the applicable
    explicit timezone; delegated expressions send due.string/lang en plus explicit timezone when supplied.
    Preserve omitted-zone request semantics. Current._seed/_signature/_merge/_map, domain reminder preservation,
    local/codec snapshot_data/snapshot_from and history round-trips must retain the authoritative kind/zone/rule/language
    and precise epoch. Do not store a last-input-zone or second account authority. Existing valid local
    state/pending history stays readable; change representation only when necessary and compatibly.


    Resolve a supported nonrecurring occurrence move in its input zone first, then preserve the previous
    recurring rule, original language and recurrence timezone. Inspect both retain_recurrence calls (proposal
    and Gateway) and raw_due merging so neither reinterprets the new instant nor restores an obsolete
    date. Keep floating/fixed and date-only semantics; a date-only result cannot acquire a clock/zone.
    New delegated recurring expressions may replace the pattern and zone through Todoist, without stale
    old rule/language/zone overriding them. Do not invent a local recurrence engine, parse-only HTTP round
    trip or recurrence advancement. At the request/reconciliation boundary prove the named rule/zone survives
    across representative DST offsets rather than storing only a first-firing offset.


    Preserve complete desired-set equivalence/no-op, duplicate detection, ID retention and independent
    reminder metadata. Same first instant with a different zone/recurrence is not equivalence. Attention-only
    changes issue no reminder reschedule; keep retains stable IDs and non-English metadata. Removal confirmation/cancellation/noninteractive
    refusal occurs before every task/reminder write, with the original unresolved expression in the preview.
    Existing clear forms, capability/relative exact-time checks and locally required hiding/ancestor comparisons
    remain. Named input interpretation does not move account-local visibility days or buckets. Keep tolerant
    hidden-category scheduling and imported conventions under the later accepted coexistence definitions.


    Inspect both Gateway and CaptureWorkflow reconciliation checks, including unresolved branches and
    the omitted fixed-zone fallback: explicit zones must reach the request and predictions without being
    replaced by the account default; recurring/known exact results keep strict applicable semantics and
    inclusive two-second remote tolerance, while local equality stays exact. For delegated named input
    with no predicted instant, still verify the applicable explicit named-zone semantics on timed authoritative
    results instead of bypassing metadata checks; date-only attention normalization has no persistent
    clock zone. Delegated attention may validly normalize to date-only; delegated absolute reminders need
    exact time. Preserve provider rejection versus unknown acceptance, accepted-but-invalid normalization,
    ordered stopping/unattempted remainder, actual state/receipts, protected history and per-file publication
    without rollback. Do not claim a provider-owned abbreviation result has a predetermined zone or instant.


