  goal: Integrate and audit all Accepted requirements using dependency source, focused tests and exact
    contract map without changing protected inputs. Supply scripts/verify-clean, copied-installation probes
    and final acceptance evidence; make only demonstrated integration/coverage repairs within declared
    components, preserving earlier product behavior. Run in the execution-setup-pinned Linux/amd64 CPython
    3.11 Docker image with direct Codex and available GNU less/tzdata; if environment is absent report
    setup blocker, do not install Python runtime dependencies. Record Git status entry/end, isolated temporary
    HOME/environment with synthetic tokens only, copy unchanged todo plus entire todo_lib tree to a temporary
    PATH directory, run from outside repository with no source/tests import dependence. Exercise copied
    help plus representative persisted read/lookup and controlled initialization/mutation/report behavior
    using test-only transport injection; do not add runtime test flags or contact Todoist. verify-clean
    composes exactly one scripts/check complete suite plus distinct copied probes and bounded real less
    -FR PTY evidence for short fit, long G/q/color, with controlled failures/SIGINT already tested. Harness
    self-tests use tiny synthetic suites and never relaunch full suites. Document install/copy commands,
    config, backup/consistent restore/history.json path, cache versus full-directory reset/cursor consequences
    and explicit user-run disposable-account smoke with outcomes/cleanup; runner never performs smoke.
    acceptance-evidence.md records observed source subject, commands/results, exact limits, provider-contract
    versus live unverified behavior and any concrete gaps, not a new test ledger or invented independent
    review. Verify open A/nested B/comment -> external completion evidence -> refresh/restart/cache rebuild
    -> preview/failure preservation -> successful final cleanup path through the public composition, including
    newer pending ancestry retention and separate-process ordering. Reuse matching evidence already adequate;
    add focused cases only for real gaps.
  failure_domain: The complete release is evidenced in the pinned Linux/amd64 Python 3.11 environment
    and works as an unchanged copied runtime.
  verification_rationale: Focused tests/delivery/final prove verification-harness/copy isolation and failure
    propagation using small disposable fixtures, not broad nested application reruns. Runner final-delivery
    executes verify-clean once as the same ID for task/integrated/stage/project roles on its settled subject.
    scripts/check is the sole full-suite call inside verify-clean; copied probes/real-less are distinct
    evidence. Search logs/code for inherited credentials, generated artifacts, unauthorized network and
    source import coupling. Earlier integrated-complete is a different pre-audit subject; on final subject
    final-delivery subsumes it, using shared prerequisite policy described in TASK.md. No live Todoist,
    performance/stress/extra platforms or full-history guarantee. Run the named focused unittest command
    while implementing; it is a starting point for relevant dependency checks. Required tests must not
    silently skip. The runner owns settled integrated/final broad checks; do not repeatedly run a full
    suite for each role.
  correction_instructions: 'Command-time precision: REQ-TIME-001 and REQ-VERIFY-024 supersede only exact
    subsecond command-time demands in older selected definitions and inherited precise-interface descriptions.
    Ordinary timezone-aware datetime projection is permitted for urgency, countdowns, relative attention
    scheduling and relative report-boundary parsing; preserve one applicable command-time reference, full-second
    distinctions, account timezone/calendar/DST correctness and exact templates. Preserve precise stored
    values, full-instant ordering, explicit absolute inputs and exact no-op semantics, resolved report
    event eligibility and finalization/cleanup. Do not add an exact-clock API repair, forced whole-second
    normalization or storage migration. Audit the current scoped precision policy in implementation, tests
    and copied-runtime evidence. Ordinary command-time projection, including T15 relative boundary parsing,
    is accepted; do not reintroduce the superseded exact-command-time review demand. Reuse T10/T12/T16
    evidence for meaningful full-second and calendar/timezone distinctions, verifying unchanged precise
    persisted ordering and absolute report/cursor/event eligibility separately. Keep the existing single
    final-delivery broad gate and fill only demonstrated coverage gaps. Audit the T19 precision repair
    and consumer regressions against REQ-DOM-014, REQ-SYNC-027, REQ-CLI-021 and existing report/full-instant
    requirements. In an existing copied-runtime read/report probe retain precise creation/comment/occurrence
    values through persisted reload, observe submicrosecond order and exact final cursor, and verify known-to-null
    is preserved where supplied. Reuse matching source evidence for detailed malformed/failure cases;
    do not multiply a workflow per timestamp field. Record actual subjects and limitations in acceptance-evidence.md.
    The existing final-delivery gate remains the single full-suite/copy acceptance path on the settled
    subject. Publication boundary: docs/design/publication-failure.md supplies the scoped successors to
    the earlier cache/history/interruption promises. Apply REQ-CACHE-009/010, REQ-LOCAL-007 and REQ-CLI-036
    to this task; old selected definitions remain binding outside that explicit scope. After the first
    successful destination replacement, later failure may leave individually complete mixed files requiring
    explicit recovery; never promise a usable old snapshot or accept a mixed view. Preserve pre-publication
    files, pending-history content, exact timestamps, remote outcome classification and no mutation replay.
    Own final REQ-VERIFY-023 evidence and operational documentation for the accepted limitation. Reuse
    observed T08/T11/T18/T16 evidence for pre-first/later replacement and SIGINT where adequate; fill
    only concrete gaps. Document partial publication, possibly unusable saved snapshots, mixed-set refusal,
    optional read-only refresh where applicable and manual consistent-set restoration/init rerun where
    validation blocks it. Preserve pending history in recoverable files and disclose full-directory reset
    loss. Audit ordinary refresh and accepted recurring mutation recovery without another completion/undo.
    The sole final-delivery broad gate remains unchanged. Own final REQ-VERIFY-025 audit and operational
    documentation for the REQ-INIT-009/OUT-INIT-001 scoped manual-recovery boundary. Earlier partial-publication/rerun
    wording applies outside that explicit exception. Reuse representative T11/T16 evidence for clear failed-phase/nonzero
    first-init write failure, individually complete destinations, preservation before the first replacement
    and refusal of mixed/unusable sets. Do not require successful init-rerun recovery of every partial
    local first-init state, including a timezone change with old unbound floating history. Document the
    existing explicit procedure: stop todo processes, optionally back up wanted local data, delete the
    entire ~/.todo directory and rerun todo init; disclose local configuration/binding/cache/pending-history/report-cursor
    loss, possible loss of unreported observations, new initial report boundary on success and unchanged
    remote Todoist data. No automatic deletion, new recovery command or shared-store repair. Existing
    safe reruns may remain, and successful first init, valid-binding repeat history/cursor preservation,
    partial remote-provisioning reuse and ordinary synchronization/timezone/current-truth obligations
    remain required. Audit that normal init retains actual task/note edits, nulls, pending ancestry and
    comments across read omissions/reload while later explicit changes/deletions/scope/ownership evidence
    win; reuse current T11/T16 regressions and fill only concrete composed/copy gaps. Keep the existing
    final-delivery gate and subsecond/publication agreements unchanged.'
