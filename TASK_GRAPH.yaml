    values, full-instant ordering, explicit absolute inputs and exact no-op semantics, resolved report event
    eligibility and finalization/cleanup. Do not add an exact-clock API repair, forced whole-second normalization
    or storage migration. Resolve the parent of a parent/direct-child alias across open tasks and steps
    before restricting children by the selected stable parent ID. Preserve or re-establish the nested-parent
    correction: Root -> Branch -> Leaf must select Leaf with Branch as parent, mixed task/step parent ambiguity
    is resolved before child selection, and non-direct descendants are refused. Keep persisted nested-parent,
    mixed ambiguity and interactive-selection evidence. The earlier review precision finding and correction
    attempt demand for exact submicrosecond command-now distinctions are superseded, not current failures;
    reconcile that regression to meaningful full-second before/equal/after due cases across queue, now --all,
    detail, implicit lookup and ambiguity, with cached-clock recomputation and zero offline HTTP. Use the
