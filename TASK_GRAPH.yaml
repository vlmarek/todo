    instant remains authoritative and the name supplies schedule metadata, never a reinterpretation of
    the clock. No blanket clock-token restriction; locally known date-only attention remains date-only,
    and date-only absolute reminder input fails before any write. Do not extend parse_boundary/report
    grammar or change account_timezone/day/urgency/visibility authority.


