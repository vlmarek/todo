  goal: Implement initialization capability. With populated config validate all local state before HTTP;
    missing/owned zero-byte config uses terminal-only wizard, explicit limited mode repairs before credentials,
    hidden token or environment (never persist environment token), transient eligible root/category discovery
    and exact fallback suggestions. Confirm full proposed config/structure before protected config save
    and same-invocation continuation; cancellation/failed discovery cannot provision fallbacks. Existing
    binding prohibits account/root switching even with config deleted. Read-only full-plus-delta live-task
    preflight precedes every provision, needs no activity endpoint/history capability and accepts legitimate
    checked false, nullable timestamps, optional descriptions and floating due. Provision only missing
    authorized root/default categories/waiting label, then full-plus-delta validation, staged cache/history/cursor
    and binding-last publication. Repeat init with a valid binding preserves cursor/pending history. Report
    saved configuration separately from init failure and accepted remote creations for explicit remote-provisioning
    reuse. Failed local first-init publication follows REQ-INIT-009; successful rerun recovery of every
    partial local state is not promised.
  failure_domain: A new or populated configuration initializes the chosen managed scope safely; valid-binding
    repeats preserve pending history/cursor, and failed first-init publication has the explicit manual-recovery
    boundary.
  verification_rationale: Controlled terminal/HTTP/temporary-home tests cover absent directory, owned
    empty 0644 config accepted/declined repair, populated never rewritten, no-TTY unchanged, hidden-input
    failure, environment-token non-persistence and EOF/SIGINT. Existing-root categories are offered without
    fallback creation; incomplete discovery does not imply empty. An invalid managed checked or tree with
    missing category/label must block all provisioning; valid unavailable history permits init. Valid-binding
    repeats and reuse after partial remote provisioning preserve stable IDs/cursor/history; partial local
    first-init recovery follows REQ-INIT-009/REQ-VERIFY-025 instead of a universal rerun guarantee. File
    failure before final binding rejects mixed publication without guessing recovery. Run the named focused
    unittest command while implementing; it is a starting point for relevant dependency checks. Required
    tests must not silently skip. The runner owns settled integrated/final broad checks; do not repeatedly
    run a full suite for each role.
  correction_instructions: 'Use T19 precise local/model contracts for preflight and initialization candidates.
    Through the actual current adapter and public store, retain a >6-digit creation timestamp through
    first publication and reload, and preserve pending precise history/cursor on repeat initialization.
    Null creation stays valid and required malformed timestamps still block provisioning. Extend existing
    initialization fixtures; do not add another setup workflow or new public option. Publication boundary:
    docs/design/publication-failure.md supplies the scoped successors to the earlier cache/history/interruption
    promises. Apply REQ-CACHE-009/010, REQ-LOCAL-007 and REQ-CLI-036 to this task; old selected definitions
    remain binding outside that explicit scope. After the first successful destination replacement, later
    failure may leave individually complete mixed files requiring explicit recovery; never promise a usable
    old snapshot or accept a mixed view. Preserve pre-publication files, pending-history content, exact
    timestamps, remote outcome classification and no mutation replay. First and repeat init use the same
    per-file boundary. Preserve existing cursor and all still-required pending observations in candidates;
    after partial publication retain available bytes and disclose failure/accepted remote provisions rather
    than claiming whole-set preservation. Scoped first-init exception: docs/design/partial-initialization-failure.md
    REQ-INIT-009 and OUT-INIT-001 supersede earlier rerun/recoverable-history wording only after failed
    local first-init publication before coherent initialization. Report failed phase/nonzero, retain complete
    restrictive per-file candidates and binding-last safety, preserve available bytes and reject mixed/unusable
    state. Existing explicit manual full-directory fresh start is sufficient: stop processes, optionally
    back up wanted data, delete the entire ~/.todo directory explicitly and run todo init; disclose loss
    of local config/binding/cache/pending observations/report cursor and new initial report boundary,
    with remote data unchanged. No automatic deletion, new command, journal, guard bypass, guessed association/timezone/cursor
    or shared-store repair is assigned. In particular, a binding-last failure followed by changed account
    timezone and incompatible unbound floating history may fail clearly and require that manual action;
    do not implement a guarantee of successful rerun or remove safe reruns already working. Keep normal
    successful first init, valid-binding repeats and partial remote-provisioning reuse required.


    Current normal-operation corrections remain mandatory independently of this exception. Each validated
    preflight and post-provision full-plus-delta observation must join pending history with required ancestor
    context before later reads can omit it; the final cache reflects its own authoritative current read.
    Preserve preflight-observed task/step title, description, due/raw time, priority, parent/category,
    exact or authoritative-null timestamps and supported completion evidence through subsequent omission,
    public StateStore reload and a later valid-binding init. Later explicit task changes, reopen/completion
    evidence, confirmed item deletion or scope departure supersede older observations; active/full omission
    alone is not deletion or completion proof. Reconcile current notes for retained known managed owners,
    including edited bodies and exact/null posted_at, new notes, explicit tombstones and ownership loss,
    even when the owner is absent from the filtered live snapshot. Later explicit note evidence wins;
    ordinary omission preserves required pending notes. Category/root renames retain stable IDs while
    current names/scope and authenticated timezone/capabilities override retained values; departed subtrees
    and unrelated/private data remain removed. Preserve initial/incomplete history coverage, pending observations
    and the valid existing cursor. For normal successful first and repeat init, accept legitimate floating/fixed
    due values and authenticated timezone changes with current authority; the partial-first-init exception
    is not a waiver for those paths.


    Concrete inputs: accepted todo_lib/adapter/current.py retrieve returns Current(snapshot, sync_token,
    disappeared_ids, deleted_ids, departed_ids); todo_lib/local/history.py History and merge_history require
    explicit removed item/comment evidence and complete ancestor context, with incoming current values
    winning and omission retaining observations. todo_lib/local/store.py StateStore load_consistent_state/load_history,
    prepare_candidates and publish_snapshot enforce association/path/mode checks; reuse them without editing
    the shared store. todo_lib/workflows/sync.py _known/_reconcile and tests/workflows/sync/test_sync.py
    provide existing current-truth, retained-comment, deletion/scope and timezone patterns. Implement
    initialization in the assigned workflow/tests using actual dependency APIs, including raw current
    note evidence where the public live snapshot filters retained owners; no new provider behavior or
    activity prerequisite. The revision restarts this task: abandoned candidate code is not continuation
    input, and this assignment does not authorize inspection or copying of sibling/abandoned worktrees.


    Extend existing actual Transport/current-adapter/public-StateStore fixtures where available. Distinguish
    preflight-observed edited task fields and known-to-null values followed by full/delta omission from
    later explicit supersession/deletion/departure; assert exact pending values/context after reload and
    subsequent init, not only final cache. Distinguish a pending-only owned comment edited in an actual
    read from a preseeded edited history fixture; verify later tombstone/ownership loss wins and later
    ordinary omission retains its latest body/time. Validate malformed required task/note fields for known
    managed owners before provisioning; failures preserve protected bytes and issue no provisioning request,
    while ownership-first discard of unrelated unsupported objects remains. Representative local first-init
    write failure must report failure, leave individually complete old/candidate destinations, and refuse
    a mixed set without HTTP; successful rerun across changed timezone is not a required assertion. Reuse
    adequate pre-publication and valid-binding repeat evidence. Focused feedback is the t11-focused command
    and, when these adapters/history/store are directly consumed, python3.11 -B -m unittest tests.adapter.current.test_current
    tests.local.test_local -v with PYTHONDONTWRITEBYTECODE=1. No repeated broad suite or exhaustive failure
    matrix.'
