    Sync followed by per-A/B comments, and several tests splice positional request steps: migrate those
    expectations and data so active current text comes from Sync notes. Preserve distinguishing outcomes
    rather than simply deleting old REST expectations. In particular migrate test_archived_owner_with_known_parent_requires_current_own_comments
    to one exhausted archived lookup, test_retained_archived_metadata_is_not_current_owner_evidence and
    test_retained_archived_parent_cannot_resolve_current_comment_role to continue explicit failure, and
    move the incomplete REST page case in test_blank_report_incomplete_page_keeps_cursor_and_no_output
    to a genuinely uncovered/archived owner. Keep active malformed Sync note failures too. Migrate tests/delivery/final/copy_probe.py
    reports and affected CLI/lifecycle/init/move/gateway doubles in this same task so the integrated subject
    remains usable. Tests must not accept both redundant and optimized request sequences.


    Begin feedback with one coherent actual adapter -> persisted reload -> Reporter scenario: observe
    active parent A/step B/comments, externally complete B with supported evidence, save and reload, then
    report with a true saved-token delta plus an unchanged active owner and an eligible archived comment.
    Assert the request token, delta change/tombstone effects, B''s non-active provenance, fresh/current
    report text/actual ancestry, one complete archived REST lookup and zero per-covered-active-owner lookups;
    assert preview leaves cursor and pending context intact. Extend remaining fixtures after that slice
    is usable. Reuse existing precise interval/recurring undo, edited/deleted/current blank comments,
    capabilities/retention, full replacement/rebuild, malformed/repeated pagination, output/flush/cursor
    failures, partial-publication and scope-departure cases. Missing required archived metadata must still
    fail before normal output with unchanged cursor and required pending bytes, even after a previous
