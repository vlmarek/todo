- id: T01
  title: Offline recursive model and account-time rules
  origin_stage_ref: release-1
  observable_outcome: A supplied managed snapshot can be validated, traversed and classified offline with
    exact account-time semantics.
  dependencies: []
  goal: Create the shared model and time APIs described by managed-model/time-policy, including title/body
    validation, optional canonical waiting blocks, role-from-parent relationships, active sibling uniqueness,
    depths 0-4, known/unknown timestamps, effective priority for creation versus own-value urgency, own/ancestor/category
    hiding and recent lifecycle eligibility. Implement local attention/reminder/boundary parsers as reusable
    pure policy; parser command arity belongs to T03 and remote wire mapping to T05. Include month direct-add/clamping,
    business/calendar versus elapsed arithmetic, strict next weekday/Monday, remote floating fold/gap
    policy and local DST refusal. Preserve raw due data/fractions and separate exact no-op from reconciliation
    slack. Do not compute report current-truth/event eligibility here. Export documented concrete types/helpers
    for downstream tasks; do not add a generic framework.
  failure_domain: A supplied managed snapshot can be validated, traversed and classified offline with
    exact account-time semantics.
  verification_rationale: 'Pure supplied-value tests decide hierarchy/order, text/waiting-block negatives
    and date semantics before any adapter exists. Distinguishing cases: out-of-order nested depth 4 valid
    versus depth 5/cycle/orphan/completed ancestor; authoritative null creation; P1 grandchild changes
    copied effective priority but never parent NOW rank; exact due equality versus 1 second either side;
    date-only +7/+8; Prague remote overlap 00:30Z and gap 01:30Z with fractions versus local refusal;
    Jan 31 +2 months March 31. Run the named focused unittest command while implementing; it is a starting
    point for relevant dependency checks. Required tests must not silently skip. The runner owns settled
    integrated/final broad checks; do not repeatedly run a full suite for each role.'
