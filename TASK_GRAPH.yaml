  title: Correct provider project sharing and initialization discovery diagnostics
  origin_stage_ref: project-sharing-correction
  observable_outcome: is_shared-only personal projects complete discovery, initialization, repeat init
    and refresh; unsafe or unknown sharing is rejected before mutation and wizard discovery failures identify
    their actual phase.
  dependencies:
