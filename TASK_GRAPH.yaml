    suffix syntax across schedule/hide, creation and task/step forms, date aliases and equals forms; keep
    selector boundaries, inline-step exclusions, existing relative reminder grammar and type-specific
    keep/clear. Add focused evidence in tests/domain/test_named_timezones.py and tests/workflows/capture/test_named_timezones.py,
    reusing strict source-grounded adapter/CLI fixtures. Include at 2026-10-29T00:30Z tomorrow in New
    York = Oct 29 versus Prague = Oct 30; 2026-11-12 09:00 New York = 14:00Z; distinct attention/reminder/omitted
    zones in one request; unknown location and New York 2026-11-01 01:30 / 2027-03-14 02:30 refusal with
