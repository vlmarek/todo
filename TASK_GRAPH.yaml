  goal: 'Implement public-cli and routine-check by composing accepted dependency APIs, without parallel
    implementations. Root todo is regular executable exact python3 shebang with sibling todo_lib layout.
    Wire complete canonical help/aliases, default now, full implicit query and syntax/domain/operational/output/partial/SIGINT
    statuses and streams. All prompts including hidden wizard go through T03. Top-level boundary redacts
    secrets/unexpected exceptions and cleans locks/temp/terminal on interruption without rollback, cache
    deletion or premature cursor/history update. Own explicit cross-cutting integration: sample setup-to-now/capture/refine,
    step alias scheduling and move, editor comments, archived completion/reopen, search and report/final
    cursor using actual workflows/adapter with controlled transport. Use representative public calls,
    not one full end-to-end matrix per alias. REQ-VERIFY-* ownership here establishes composed coverage;
    dependency focused tests provide detailed clauses. scripts/check validates required launcher/imports/syntax
    without bytecode and runs the complete offline suite once; fail no tests/missing required packages/required
    skips, use synthetic mini-suites to test discovery/failure propagation without recursive full runs.
    Adapt actual dependency APIs and repair demonstrated source/test integration defects within the declared
    components; all producers are dependencies, so this overlap is sequential. Report protected-input
    or product contradictions rather than bypassing boundaries.'
  failure_domain: The copied-layout public CLI reaches every canonical workflow and scripts/check exercises
    the complete offline implementation.
  verification_rationale: Named task check is focused tests/cli with actual main/launcher routing, help
    without state, no-arg equivalence, typed ambiguity, status/stream/signal/secret protections and representative
    composed workflows. Include tiny tests/delivery/check via that suite or explicit loader, documenting
    count. Do not make CLI self-tests invoke scripts/check or verify-clean against the full repo. Runner
    integrated-complete invokes scripts/check when T16 is available; same subject roles reuse this ID.
    Full suite also covers earlier focused packages; that regression on newly composed source is purposeful,
    not repeated per role. Run the named focused unittest command while implementing; it is a starting
    point for relevant dependency checks. Required tests must not silently skip. The runner owns settled
    integrated/final broad checks; do not repeatedly run a full suite for each role.
  correction_instructions: 'Command-time precision: REQ-TIME-001 and REQ-VERIFY-024 supersede only exact
    subsecond command-time demands in older selected definitions and inherited precise-interface descriptions.
    Ordinary timezone-aware datetime projection is permitted for urgency, countdowns, relative attention
    scheduling and relative report-boundary parsing; preserve one applicable command-time reference, full-second
    distinctions, account timezone/calendar/DST correctness and exact templates. Preserve precise stored
    values, full-instant ordering, explicit absolute inputs and exact no-op semantics, resolved report
    event eligibility and finalization/cleanup. Do not add an exact-clock API repair, forced whole-second
    normalization or storage migration. Own current composed REQ-VERIFY-024 evidence across reads, relative
    scheduling and relative report/cursor-boundary parsing. Retained T15 Reporter._boundary projects its
    command time into parse_boundary for calendar arithmetic; that projection is permitted and must not
    be rejected for losing subsecond command precision. Inspect retained source and focused evidence,
    permit no change when compatible, and adapt actual caller/test mismatches within existing scope if
    demonstrated. Reconcile any stale strict command-now subsecond assertions to full-second before/equal/after
    and existing calendar/timezone cases; retain exact storage/order, absolute boundary/event-window,
    output-before-cursor and cleanup tests. Reuse adequate dependency evidence and preserve nested-parent
    alias behavior through public composition without duplicating a full case matrix. Compose T19 precise
    APIs across all consumers and adapt any remaining fakes/call sites only for demonstrated integration
    defects. Add a representative public detail/report regression using actual adapter, persisted state
    and rendering with >6-digit provider timestamps: exact order and cursor survive reload while human
    templates remain unchanged. Reuse focused dependency evidence for detailed null/invalid/ordering cases;
    scripts/check includes the new domain/local cases once in its complete suite and self-tests still
    use synthetic mini-suites. Publication boundary: docs/design/publication-failure.md supplies the scoped
    successors to the earlier cache/history/interruption promises. Apply REQ-CACHE-009/010, REQ-LOCAL-007
    and REQ-CLI-036 to this task; old selected definitions remain binding outside that explicit scope.
    After the first successful destination replacement, later failure may leave individually complete
    mixed files requiring explicit recovery; never promise a usable old snapshot or accept a mixed view.
    Preserve pre-publication files, pending-history content, exact timestamps, remote outcome classification
    and no mutation replay. Own composed CLI diagnostics and SIGINT policy for the new boundary. Reuse
    focused sync/init/lifecycle/report evidence and add representative public refresh and accepted-mutation
    publication failures, with a later binding failure or handled interruption at the changed boundary.
    Verify nonzero (1 ordinary, 130 SIGINT), no synchronized normal output, correct accepted/unknown/unattempted
    receipts, complete old/candidate destination files, zero-HTTP new-process mixed-set refusal and useful
    existing recovery advice without promising refresh always works. Stop later remote operations and
    preserve cursor/history finalization ordering. Adapt stale fixtures/diagnostics in declared runtime/test
    scope only for demonstrated gaps; no storage redesign or broadened full-suite schedule. Scoped first-init
    exception: apply REQ-INIT-009/REQ-VERIFY-025 and OUT-INIT-001 before earlier rerun/recoverable-history
    wording only for failed local first-init publication before coherence. Compose T11 failure facts into
    truthful failed-phase/nonzero diagnostics and mixed-state refusal; identify the existing explicit
    full-directory fresh start with pending-history/cursor loss and remote-data-unchanged disclosure when
    needed. Never promise every partial first-init state can be repaired by init rerun, including changed-account-timezone/unbound-floating-history
    failure. No storage repair, guard bypass, new repair/reset command or automatic deletion is assigned.
    Reuse T11 representative evidence and add public diagnostics coverage only for a demonstrated composition
    gap. Preserve successful first init, valid-binding repeat history/cursor, partial remote-provisioning
    reuse, normal current-truth/timezone behavior and all other publication/subsecond agreements. Keep
    current normal task/note evidence reconciliation through CLI composition; do not treat the exception
    as approval to drop edits, authoritative nulls, own comments or ancestry, retain deleted/out-of-scope
    data, ignore config validation, or reset normal history.'
