schema_version: 1
map_id: todo-3-components
components:
- id: domain
  responsibility: Offline identity, recursive hierarchy, text, time, scheduling, selection predicates
    and invariants.
  paths:
  - todo_lib/__init__.py
  - todo_lib/domain/**
  - tests/__init__.py
  - tests/domain/**
  allowed_dependencies: []
- id: local
  responsibility: Protected configuration, binding, cursor, cache/history storage and exclusive process
    coordination.
  paths:
  - todo_lib/local/**
  - tests/local/**
  allowed_dependencies:
  - domain
- id: syntax
  responsibility: Lossless CLI grammar, shared interactive input and command help.
  paths:
  - todo_lib/syntax/**
  - tests/syntax/**
  allowed_dependencies:
  - domain
- id: adapter
  responsibility: Pinned Todoist transport, current/history mapping and operation-attributed mutation
    results.
  paths:
  - todo_lib/adapter/**
  - tests/adapter/**
  - tests/support/**
  allowed_dependencies:
  - domain
- id: presentation
  responsibility: Pure exact human rendering, color and direct/pager document delivery.
  paths:
  - todo_lib/presentation/**
  - tests/presentation/**
  allowed_dependencies:
  - domain
  - local
- id: workflows
  responsibility: Coordinate synchronization, local publication, init, reads, mutations, editing and reporting.
  paths:
  - todo_lib/workflows/**
  - tests/workflows/**
  allowed_dependencies:
  - domain
  - local
  - syntax
  - adapter
  - presentation
- id: cli
  responsibility: Executable copied launcher and public command composition, status/signal/error boundary.
  paths:
  - todo
  - todo_lib/cli.py
  - tests/cli/**
  allowed_dependencies:
  - domain
  - local
  - syntax
  - adapter
  - presentation
  - workflows
- id: delivery
  responsibility: Offline verification scripts, copied-installation acceptance, operational documentation
    and observed evidence.
  paths:
  - scripts/**
  - tests/delivery/**
  - README.md
  - docs/user/**
  - docs/implementation/acceptance-evidence.md
  allowed_dependencies:
  - domain
  - local
  - syntax
  - adapter
  - presentation
  - workflows
  - cli
interfaces:
- id: managed-model
  owner: domain
  status: provisional
  description: todo_lib.domain supplies a shared Snapshot/model with string account/root/category/item/comment/reminder
    IDs, ID-keyed collections, immediate parent links, own fields, explicit lifecycle/occurrence records,
    nullable aware added_at, capabilities and raw due representation. validate(snapshot, hidden_names)
    returns a complete valid model or a domain error naming the invalid field/invariant without raw unrelated
    payloads. Helpers return ancestor paths, ordered siblings, subtree depths, visibility, effective priority
    and eligible lifecycle candidates. Domain code has no I/O. Producers document exact exported symbols/docstrings
    in their code; consumers import that accepted dependency API rather than invent parallel model types.
- id: time-policy
  owner: domain
  status: provisional
  description: todo_lib.domain exposes parse_attention(expression, now, account_zone), parse_boundary(value,
    now, account_zone), parse_reminder(value), and resolve_remote_due(raw_due, account_zone). Inputs retain
    original scalar text; results distinguish date-only, exact fixed/floating instant, unresolved provider
    expression and invalid input. One supplied aware now is used. Local DST ambiguity/gap is an error;
    remote floating overlap chooses earlier instant and gap shifts by its actual size. Preserve recurrence/raw
    fractions, and use exact local no-op comparison versus separate <=2-second reconciliation tolerance
    with strict day/rule/zone checks.
- id: configuration
  owner: local
  status: provisional
  description: 'todo_lib.local loads ~/.todo/config only after path/mode validation, returning typed project/default_sections/hidden_from_now,
    warning/color/pager settings and a redacted credential resolver. Resolve token once: nonempty environment
    first, then config; wizard may supply a hidden token. Missing/empty/populated config states stay distinct.
    Invalid recognized settings fail before HTTP; unknown settings are ignored. Pager/editor argv uses
    direct shlex parsing, never shell expansion. Secret-bearing objects must not expose tokens in repr/errors.'
- id: state-store
  owner: local
  status: provisional
  description: todo_lib.local reads/writes binding.json, report-cursor and disposable cache.json with
    schema, string IDs and account/root/publication association; timezone has one authority in binding.
    APIs load_consistent_state(), prepare_candidates(), publish_snapshot() and write_cursor(aware_utc)
    or equivalent named exports validate complete candidates and atomically replace restrictive same-directory
    files. Binding is final initialization publication point; reject mixed sets without automatic repair.
    A failed individual replacement retains its prior complete destination; partial multi-file initialization
    is detected, not rolled back. Ignore temporary candidates. Cursor setter supports readable corrupt/missing
    old content, not unsafe/unreadable paths. Cache/token publish together; clearing touches only current
    cache.
- id: history-store
  owner: local
  status: provisional
  description: todo_lib.local uses protected history.json separate from cache.json, initially explicitly
    incomplete. Load/save accepts account/root/publication association and managed observations, occurrences,
    own comments, necessary ancestors and coverage. Missing required/corrupt/foreign history fails without
    resetting bytes. Stable-ID merge and post-finalization cleanup retain context for newer pending work;
    authoritative deletes/departures remove related observations. Primitive storage has no HTTP or report
    side effects; workflow supplies the evidence and finalized cursor. Cleanup is idempotent and cannot
    roll back an advanced cursor.
- id: exclusive-lock
  owner: local
  status: provisional
  description: todo_lib.local exclusive_lock(operation) is a fail-fast POSIX process-lock context acquired
    before coordinated reads. It reports busy status, releases on handled failure/SIGINT and never queues/waits.
    Offline readers are lock-free and reject inconsistent publications. All stored sensitive paths are
    real files/directories with 0600/0700 before content access; wizard permission repair is an explicit
    separately confirmed operation, never an ordinary load side effect.
- id: command-grammar
  owner: syntax
  status: provisional
  description: todo_lib.syntax parse(argv) returns a normalized command request preserving selector phrase/term
    boundaries, original creation groups, literal insertions, empty promotion destination, singleton/repeatable
    options and scalar values. Syntax failures carry status 2, offending input, synopsis/example; no config/HTTP
    is read. Leading scalar noun actions consume adjacent VALUE before task or parent/step operands; canonical
    rename/move boundaries remain distinct. Alias normalization reaches the same canonical request type.
    Help requests are independent of state; T16 completes public help wiring.
- id: prompt-input
  owner: syntax
  status: provisional
  description: One todo_lib.syntax prompt/input function checks both stdin/stdout TTY, writes and flushes
    stdout before reading, supports hidden token input without echo, EOF/cancel/default/validation and
    restoration. Selection receives explicit numbered candidates and returns the chosen stable object
    or cancellation; no new --yes bypass. All workflow questions use this path, including wizard and delete-all.
    Noninteractive ambiguity prints candidates but never a prompt/detail. Callbacks/streams may be supplied
    by offline tests.
- id: http-transport
  owner: adapter
  status: provisional
  description: 'todo_lib.adapter.transport performs authenticated API-v1 requests against https://api.todoist.com/api/v1
    with method/path/form/query/JSON explicitly supplied, 30-second timeout and the accepted four-attempt
    status/delay policy. It accepts controlled opener/sleep/clock hooks, emits redacted stderr retry facts,
    returns decoded response or typed rejected/transport/protocol/outcome-unknown error. Mutation requests
    carry a caller-owned UUID/replay classification: ambiguous outcomes return to reconciliation before
    any replay. The retained API is the wire authority. Tests/support provides small request-recording
    controlled HTTP helpers without a general provider emulator.'
- id: current-retrieval
  owner: adapter
  status: provisional
  description: todo_lib.adapter.current retrieves raw Sync current resources and merges full/deltas by
    stable ID, returning a validated managed Snapshot plus token/account/timezone/current capabilities.
    Fetch initial/client replacement with * then exactly one freshness delta; a server full_sync=true
    requires the same bounded follow-up. Required full fields and optional unchanged delta omissions differ.
    Scope projects broadly before managed ownership-first mapping. No activity resource or history access
    is needed for initial live preflight. API accepts prior cache/token and binding, reports unresolved
    disappeared known identities for lifecycle reconciliation by T08, and never writes local files.
- id: history-retrieval
  owner: adapter
  status: provisional
  description: todo_lib.adapter.history completed(start,end,scope), activities(start,end,scope) and comments(owner_id)
    return complete endpoint-shaped mapped records with source/ownership context, continuation evidence
    and precise times, or explicit incompleteness. Completed UTC requests span <=3 months each, use items
    and documented terminal next_cursor omission; activities/comments require results and next_cursor
    with null terminal. All query parameters remain fixed across pages. Widen wire [start,end) to cover
    product (start,end], then filter exactly, retaining fractions and split edges. Current scoped REST
    comments need no item_id. Archived owner resolution uses only supported current evidence; active GET
    404 is unresolved, never deletion proof.
- id: mutation-gateway
  owner: adapter
  status: provisional
  description: todo_lib.adapter.commands accepts one validated semantic operation with stable target,
    command UUID and create temp ID, serializes exact Sync commands and reports accepted/rejected/unknown
    with operation-attributable IDs/evidence. Preserve UUID across safe retries; require exact sync_status
    and create temp_id_mapping. Reconcile ambiguous results read-only using current/history retrieval;
    matching text or unchanged recurrence never proves an operation. Export direct provision/create/update/comment/reminder/move/complete/reopen/delete
    calls, with item_move one destination and recurring is_forward/reset_subtasks semantics. Return actual
    state/evidence; workflow revalidates complete invariants and publishes, never the gateway. No compensating
    rollback.
- id: synchronized-state
  owner: workflows
  status: provisional
  description: todo_lib.workflows.sync loads consistent state under caller-held lock, performs current retrieval
    then required evidence-based disappearance/lifecycle reconciliation using history retrieval, merges
    protected pending history and publishes a complete valid snapshot/history/binding timezone association.
    refresh(clear_cache=False) deletes only cache when explicitly authorized; read_local() performs zero
    HTTP. Return Snapshot/history/one command time plus classified failure and applicable saved-state/read-only
    recovery facts. Mutation callers invoke reconciliation after every accepted operation; unknown outcomes
    cannot publish invented acceptance. Before first replacement retain prior files unless explicitly cleared.
    Publication is per-file atomic under REQ-CACHE-009/010 and REQ-LOCAL-007; after a successful replacement
    later failure may leave a mixed set requiring explicit recovery. Preserve pending-history content and
    reject incompatible associations. Failure facts follow REQ-CLI-036 without claiming old-snapshot usability
    or automatic repair; no persisted validity modes.
- id: rendered-documents
  owner: presentation
  status: provisional
  description: todo_lib.presentation pure functions render_now/detail/comments/waiting/someday/search/ambiguity/receipts/report
    from shared model, selected populations/events, one now and binding timezone. Return complete stdout/stderr
    documents rather than performing I/O or refetching. Named TPL text and edge newline normalization
    are authoritative; IDs stay internal. Shared attention/ancestor/waiting-reason formatting supplies
    all consumers. report receives already selected Finished/Progress/Hidden view data; presentation does
    not decide interval eligibility or cursor updates.
- id: document-delivery
  owner: presentation
  status: provisional
  description: todo_lib.presentation deliver(document, settings, original_streams, view_kind) writes/flushes
    directly or directly invokes configured pager argv for eligible read-only TTY views. Complete rendered
    text/colors are chosen against original stdout, not a child pipe. Normal pager quit succeeds; true
    failure warns and prints complete original direct output without HTTP. Final reports always bypass
    the pager and expose write/flush failure to finalization. SIGINT restores terminal/temporary state
    and propagates status 130; it never starts fallback.
- id: read-commands
  owner: workflows
  status: provisional
  description: todo_lib.workflows.reads executes cache-first now/waiting/someday/detail/comments/search/category/implicit
    lookup requests, using read_local or explicit refresh before selection, shared model matching and
    shared chooser/render/delivery. Return status/documents or useful typed local/sync/ambiguity errors.
    Detail/search combine compatible pending history without duplicates, disclose coverage, preserve nested
    ownership/paths and never perform HTTP absent refresh. This capability does not create comments or
    mutate objects.
- id: initialization
  owner: workflows
  status: provisional
  description: todo_lib.workflows.init executes populated-config/repeat init or interactive missing/zero-byte-config
    wizard with the shared prompt. Preflight live managed tasks read-only before any structural creation;
    use current retrieval without activity dependency. Return accepted/unknown/unattempted provisioning
    and staged publication facts. Bind stable account/root/category IDs, preserve existing cursor/history,
    save confirmed protected INI then continue same invocation, publish binding last. Discovery catalogue
    is transient. No doctor, --rebind or populated-config rewrite.
- id: capture-scheduling
  owner: workflows
  status: provisional
  description: todo_lib.workflows.capture/scheduling execute task/step creation, priority/rename/category
    creation, schedule/reminder/hide/unhide requests. Consume normalized grammar, synchronize/choose,
    validate complete proposed batch/tree/capability/no-op before first mutation, execute ordered gateway
    calls, reconcile each accepted result and publish via sync. Return actual receipt/outcome records
    for presentation. Inline steps, recurring due preservation, hidden-category restrictions and supported
    zero reminders use shared model/time APIs; no duplicate alias workflows.
- id: hierarchy-moves
  owner: workflows
  status: provisional
  description: todo_lib.workflows.moves executes positional/marker category moves, attachment/reparenting
    and explicit promotion on tasks/steps. It selects source then typed destination, validates complete
    known resulting depth/siblings/hiding and preserves all stable item/comment identities and raw own
    fields. Reconcile available known surviving descendants without all-history childlessness proof; return
    changed parent/category and resulting role or classified failure with no rollback.
- id: lifecycle-transitions
  owner: workflows
  status: provisional
  description: todo_lib.workflows.lifecycle executes done/reopen/delete on tasks/steps. Validate full
    known subtrees and recent occurrence interval, confirm only where allowed, order postorder completions,
    reconcile archived completion and restored ancestors and stop on first failure/unknown. Done comments
    use gateway on the same archived owner after completion. Return structured actual operations and unattempted
    remainder; no rollback, all-history deletion preview or blind recurrence replay.
- id: comment-editing
  owner: workflows
  status: provisional
  description: todo_lib.workflows.comments executes ordinary ordered comment creation and locked editor
    reconciliation. Buffer codec round-trips protective backslashes/header text, validates all blocks
    against originally shown IDs, computes edits/additions/deletions, confirms all-shown deletion, and
    preserves externally added comments. Direct editor argv, 0600 buffer and shared prompts survive failure/SIGINT
    cleanup. Return exact all-success counts or ordered partial outcomes; no heuristic interior-header-loss
    detection.
- id: report-finalization
  owner: workflows
  status: provisional
  description: todo_lib.workflows.report executes show/set cursor locally and preview/final report online.
    Under one exclusive lock reload cursor/binding then capture fixed end before HTTP; fully retrieve
    current state, bounded completions/activity and current own comments. Assemble current-truth Finished/Progress/Hidden,
    cancellation pairs and latest eligible comment events or fail before normal output. Final direct complete
    write+flush precedes atomic fixed-end cursor save, which precedes cleanup. Preview/set cursor cannot
    prune. Return success/diagnostic facts; cleanup failure leaves successful output/cursor and safe extra
    history.
- id: public-cli
  owner: cli
  status: provisional
  description: Executable ./todo and todo_lib.cli.main(argv) compose all normalized commands, prompt/renderer/delivery
    and workflow APIs with exact exit status, help/state independence, secret redaction and SIGINT boundaries.
    The unchanged launcher/module tree runs copied together through PATH on CPython 3.11 without repository/tests/site-packages.
    No runtime dependency installation or production test-server flag. Offline test injection stays in
    tests through supplied transport/process hooks.
- id: routine-check
  owner: delivery
  status: provisional
  description: Executable scripts/check performs syntax/shebang/regular executable/import checks plus
    exactly one complete current offline unittest suite, fails absent required suites or skips and leaves
    no generated state. CPython 3.11/Bash/stdlib only. Self-tests use tiny synthetic suites rather than
    recursively launching the application suite. scripts/verify-clean from T17 composes this check once
    with distinct copied-runtime probes; it does not run scripts/check again through tests.
- id: managed-model-precise
  owner: domain
  supersedes_ref: managed-model
  description: Successor of managed-model, preserving its identity, hierarchy, validation, own-field,
    null and lifecycle semantics. todo_lib.domain exports instant_from_wire(text), instant_key(value),
    instant_text(value) and instant_datetime(value). The parser accepts valid aware RFC 3339 instants
    without losing supplied fractional digits; malformed, naive and wrong-type values raise DomainError.
    The shared immutable precision-carrying value and aware datetime inputs have one exact UTC instant
    interpretation. instant_key returns a mutually comparable exact key for both; instant_text emits UTC
    RFC 3339 preserving all supplied fractional precision; instant_datetime returns an aware datetime
    projection for display/calendar operations only. No float or bounded-precision arithmetic may round
    semantic comparisons. Item.added_at/completed_at, Comment.added_at, Occurrence.completed_at and LifecycleCandidate.completed_at
    accept the shared value and existing aware datetime inputs; existing positional model construction
    remains usable. None is valid only where the existing field contract permits it, and authoritative
    null never falls back to old data. Validation, ordered_siblings, traversal/completion order, latest
    occurrence and recent lifecycle interval helpers use exact keys, including mixed datetime boundaries.
    Export and document concrete symbols/types in the domain API. Datetime projection is never the persistence,
    delta-seeding, equality or ordering authority.
  status: provisional
- id: time-policy-precise
  owner: domain
  supersedes_ref: time-policy
  description: Successor of time-policy preserving attention/reminder grammar, raw due/recurrence data,
    exact no-op versus reconciliation tolerance, one supplied now and account-timezone/DST policy. parse_boundary
    keeps its existing arguments and accepted date/offset-free/offset/relative forms and DomainError behavior,
    but preserves the full supplied fractional instant using managed-model-precise values where datetime
    is insufficient. Relative dates retain wall-clock semantics; explicit offsets retain exact instant
    semantics. Consumers compare/persist through instant_key/instant_text and use instant_datetime only
    for display, calendar window arithmetic or coarse retrieval bounds that are safely widened before
    exact filtering. Existing ordinary aware-datetime clock inputs remain valid. Do not replace the existing
    Attention API or change due tolerances as part of this correction.
  status: provisional
- id: state-store-precise
  owner: local
  supersedes_ref: state-store
  description: Successor of state-store with unchanged protected path/mode checks, schema/identity/publication
    association, single binding timezone, binding-last atomic publication and failure preservation. Existing
    StateStore, LocalState, prepare_candidates, publish_snapshot, load_consistent_state and write_cursor
    entry points consume/preserve managed-model-precise timestamp values as well as existing aware datetime
    inputs. Serialize timestamps as UTC RFC 3339 strings with all supplied fractional digits and restore
    exact instants for item/comment/occurrence fields, synced_at and report cursor. Existing valid schema-1
    timestamp strings, including null only on nullable fields, remain readable without discarding binding/history/cursor
    or an automatic reset. Reject malformed required timestamps with LocalError and preserve bytes. No
    timestamp sidecar or second timezone authority. Codec dataclass conversion must explicitly serialize
    shared timestamp values rather than leaking their internals.
  status: provisional
- id: history-store-precise
  owner: local
  supersedes_ref: history-store
  description: Successor of history-store preserving separate protected pending history, stable-ID/current-truth
    merge, required ancestors, coverage and explicit post-finalization-only cleanup. History snapshot
    fields, observation times and Coverage endpoints retain managed-model-precise instants through merge/save/reload
    and prune comparisons. Exact instants newer than the finalized cursor retain their required context
    even within the same microsecond. Existing aware datetime callers and valid schema-1 files remain
    usable. Authoritative null remains null; required completion/coverage times cannot become unknown.
    Missing, corrupt, foreign or mixed required history fails without resetting it. Cache clear/cursor
    set never authorize cleanup, and cleanup failure never rolls back a successful output/cursor.
  status: provisional
- id: coexistence-model
  owner: domain
  status: provisional
  description: Successor in todo_lib.domain.model/text to the accepted precise model. validate accepts
    imported duplicate task/step titles, scheduled hidden categories, inactive waiting labels, literal
    malformed/orphaned reason text and normalized inbound CRLF/blank descriptions without relaxing category
    uniqueness, hierarchy, identity or ancestor-day checks. New imported-title validation stays separate
    from CLI validate_title. Action-local collision comparison rejects newly introduced active sibling
    collisions and permits unchanged/resolved imported collisions, including reopened ancestors. Visibility
    interprets a waiting label only with attention. Document concrete callable APIs/errors in existing
    domain API.md/docstrings; no I/O in domain code.
  supersedes_ref: managed-model-precise
- id: tolerant-current
  owner: adapter
  status: provisional
  description: 'Successor in todo_lib.adapter.current.retrieve and init discovery: same Current(snapshot,sync_token,missing/deleted/departed
    evidence) contract, but consumed signatures ignore attachment/unused metadata, optional due timezone
    is null, relevance precedes unused live content and inbound text uses coexistence-model. Relevant
    project safety still requires boolean is_shared; unrelated data cannot invent managed eligibility.
    Blank comments preserve stable ownership/time. Preserve full/freshness/incremental/tombstone completeness
    and operation evidence.'
  supersedes_ref: current-retrieval
- id: tolerant-history
  owner: adapter
  status: provisional
  description: Successor in todo_lib.adapter.history.HistoryAdapter completed/activities/comments/required_comments,
    returning the existing Retrieval/Page/Activity/Comment evidence shapes. Identity/scope/lifecycle/interval
    are established before unused content; scoped comments permit documented blank defaults, ignore attachments,
    and preserve IDs/time. Do not request annotate_notes or consume annotation text; retain move/scope
    metadata used by synchronization. Preserve exact covering windows, endpoint terminal rules, event-ID
    validation, and explicit unresolved archived-owner failure.
  supersedes_ref: history-retrieval
- id: reminder-model
  owner: domain
  status: provisional
  description: Extend the existing ID-owned Reminder(id,item_id,minutes) model compatibly with tagged
    relative/absolute scheduling and necessary original due/recipient/urgent metadata. Reuse Attention/time
    helpers for resolved scheduling; preserve raw floating/fixed recurrence/language/zone and exact stored
    values, type-specific validity and no reminder effect on urgency. Existing positional relative constructors
    and old local history remain readable. Document concrete APIs in existing domain API.md; consumers
    use actual predecessor symbols, not a parallel model.
  supersedes_ref: coexistence-model
- id: reminder-current
  owner: adapter
  status: provisional
  description: Extend current.retrieve/_seed/_signature/_merge/_map to round-trip relative and independent
    absolute reminders, type-specific consumed scheduling and preserved notify_uid/is_urgent/due metadata.
    Keep tolerant-current behavior, type-aware duplicate comparison, stable ID ownership, omitted delta
    preservation and account-zone re-resolution. Necessary metadata is preserved without turning unused
    fields into blanket required predicates. Shared model/codec remains a single path.
  supersedes_ref: tolerant-current
- id: reminder-gateway
  owner: adapter
  status: provisional
  description: 'Extend existing Operation/Gateway create_reminder/update_reminder/delete_reminder compatibly:
    Sync reminder_add item_id/type and minute_offset for relative or due for absolute; updates id plus
    actual requested fields; stable UUID/temp-ID proof, Current reconciliation and Result outcomes unchanged.
    English new expressions use due.string/lang en, retained rules preserve original language/zone. Compare
    known exact predictions with inclusive two-second remote tolerance and strict kind/day/recurrence/zone;
    unresolved expressions require actual exact-time result. Preserve metadata on retained IDs; no endpoint
    parse/dedup guarantee.'
  supersedes_ref: mutation-gateway
- id: complete-reminder-scheduling
  owner: workflows
  status: provisional
  description: Successor CaptureWorkflow/SchedulingWorkflow consumes both marker types into one desired
    set, retains keep/local matches by ID, validates complete plans and confirms removals before any write,
    then executes sequentially with actual reconciled receipts. Unknown expressions remain unresolved
    until Todoist; explicit clear variants differ. Task due/recurrence/hiding and absolute reminders remain
    independent; capability/no-op/partial/unknown/unattempted rules persist. Reuse the actual CommandRequest,
    streams, prompt and gateway types.
  supersedes_ref: capture-scheduling
- id: coexistence-rendering
  owner: presentation
  status: provisional
  description: 'Successor existing pure render/formatting/receipts/report API: safe escaped scalar titles,
    blank comment marker, inactive waiting detail/receipts, complete sorted relative/absolute timing including
    undated reminder-only rows, exact removal preview and actual reconciled set receipts under REQ-OUT-022.
    Preserve all other framing, streams/color/order and report eligibility supplied by workflows. Do not
    introduce a second rendering stack.'
  supersedes_ref: rendered-documents
